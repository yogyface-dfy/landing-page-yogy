<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Laury — YoGyFace" />
    <meta name="robots" content="index, follow" />
    <!-- Vérification de propriété Pinterest (revendication du domaine) -->
    <meta name="p:domain_verify" content="8de3b421df8f346dba2a3951b23988da" />
    <!-- Le <title>, la description et les balises Open Graph / Twitter sont
         gérés par page via le composant SEO (vite-react-ssg <Head>), et
         injectés dans le HTML prérendu au build. -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#E8675A" />

    <!-- Fonts (chargement asynchrone pour ne pas bloquer le rendu) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=League+Spartan:wght@700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" />

    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=League+Spartan:wght@700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" /></noscript>

    <!-- TrustBox script -->
    <link rel="preconnect" href="https://widget.trustpilot.com" />
    <script type="text/javascript" src="//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js" async></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
